server:
  port: 9999

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          # 开启以服务 id 去注册中心上获取转发地址
          enabled: true
          # 小写 serviceId
          lower-case-service-id: true
      routes:
        # 员工服务路由
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/employee/**

        # 考勤服务路由
        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/attendance/**

        # 请假服务路由
        - id: leave-service
          uri: lb://leave-service
          predicates:
            - Path=/leave/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
